networks:
  sensors-network:
    driver: bridge

services:
  sensor-exporter:
    build: .
    environment:
      SERIAL_PORT: ${SERIAL_PORT:-/dev/ttyACM0}
      SERIAL_BAUD_RATE: ${SERIAL_BAUD_RATE:-115200}
      METRICS_HOST: 0.0.0.0
      METRICS_PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MQTT_ENABLED: ${MQTT_ENABLED:-true}
      MQTT_HOST: ${MQTT_HOST:-mosquitto}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_TOPIC: ${MQTT_TOPIC:-home/sensors/environment}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_TLS: ${MQTT_TLS:-false}
    ports:
      - "${METRICS_PORT:-8000}:8000"
    networks:
      - sensors-network
    depends_on:
      mosquitto:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/metrics')
      interval: 10s
      timeout: 3s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./monitoring/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    ports:
      - "${MQTT_HOST_PORT:-1883}:1883"
    networks:
      - sensors-network
    restart: unless-stopped

volumes:
  mosquitto-data:
