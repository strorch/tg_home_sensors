[project]
name = "home-sensors-exporter"
version = "0.1.0"
description = "Prometheus and MQTT exporter for Arduino home sensors"
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5",
    "pydantic-settings>=2.0",
    "prometheus-client>=0.22,<1",
    "paho-mqtt>=2.1,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.8",
    "types-pyserial>=3.5.0.20250326",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
